[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ldraw-mcp"
version = "0.2.1"
description = "MCP server that renders LDraw/LEGO models to images with real part geometry via headless Blender + ImportLDraw."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jaret Arnold" }]
keywords = ["mcp", "ldraw", "lego", "blender", "render"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]
dependencies = [
    # 2.x only. The range MOVES rather than widening to <3 — which is what
    # dependabot proposed in #7, and why that PR broke the build. This package
    # imports mcp.server.mcpserver, absent in 1.x, so a range spanning both
    # majors can resolve to a version that cannot import the server. mcp 2.x
    # requires Python >=3.10, exactly this package's floor.
    "mcp>=2,<3",
    "pillow",
]

[project.optional-dependencies]
# numpy is here for the blank-frame detector's control test, which must run on
# runners that have no Blender. Without it that control ImportErrors, and the
# only thing that keeps it green today is the module-level skip it should not
# have been under.
test = ["pytest", "numpy", "tomli; python_version < '3.11'"]

[project.scripts]
ldraw-mcp = "ldraw_mcp.server:main"
ldraw-mcp-setup = "ldraw_mcp.setup_cli:main"

[project.urls]
Homepage = "https://github.com/musharna/ldraw-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/ldraw_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
