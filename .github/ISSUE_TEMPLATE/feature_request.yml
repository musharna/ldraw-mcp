name: Feature request
description: Suggest an improvement to ldraw-mcp
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This server renders LDraw models through headless Blender with the ImportLDraw
        addon. Anything Blender or ImportLDraw cannot do is out of scope here — but say
        so anyway, since the boundary is worth recording.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to render or inspect and where the server gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What should the tool accept or return? A sketch of the call and response helps.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: What are you doing instead today?
    validations:
      required: false
