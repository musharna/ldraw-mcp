[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "studio-mcp"
version = "0.1.0"
description = "MCP server that renders LDraw/LEGO models to images with real part geometry via headless Blender + ImportLDraw."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jaret Arnold" }]
keywords = ["mcp", "ldraw", "lego", "blender", "render", "studio"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]
dependencies = [
    "mcp",
    "pillow",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
studio-mcp = "studio_mcp.server:main"
studio-mcp-setup = "studio_mcp.setup_cli:main"

[project.urls]
Homepage = "https://github.com/jaretarnold/studio-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/studio_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
