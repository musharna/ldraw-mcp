[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ldraw-mcp"
version = "0.1.2"
description = "MCP server that renders LDraw/LEGO models to images with real part geometry via headless Blender + ImportLDraw."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jaret Arnold" }]
keywords = ["mcp", "ldraw", "lego", "blender", "render"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]
dependencies = [
    "mcp<3",
    "pillow",
]

[project.optional-dependencies]
test = ["pytest", "tomli; python_version < '3.11'"]

[project.scripts]
ldraw-mcp = "ldraw_mcp.server:main"
ldraw-mcp-setup = "ldraw_mcp.setup_cli:main"

[project.urls]
Homepage = "https://github.com/musharna/ldraw-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/ldraw_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
